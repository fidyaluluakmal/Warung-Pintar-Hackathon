name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  edge-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Function AI harus tetap bisa dikompilasi. Kalau prompt-nya rusak,
      # ini gagal sebelum demo — jauh lebih murah daripada ketahuan di depan juri.
      #
      # Semua function wajib masuk daftar. Function yang lupa dicek tetap
      # lolos CI, lalu baru rusak saat dipanggil di depan juri.
      - name: Typecheck Edge Functions
        run: |
          deno check \
            supabase/functions/ai-advise/index.ts \
            supabase/functions/ai-ask/index.ts \
            supabase/functions/ai-extract-voice/index.ts \
            supabase/functions/ai-read-receipt/index.ts \
            supabase/functions/_shared/ai.ts \
            supabase/functions/_shared/http.ts \
            supabase/functions/_shared/normalize.ts
